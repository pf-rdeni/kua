deployment:
  tasks:
    - export DEPLOYPATH=/home/u1525344/bantu-kua
    - export PUBLICPATH=/home/u1525344/public_html/bantu-kua
    
    # 1. Prepare Directory
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/mkdir -p $PUBLICPATH

    # 2. Copy Core Files (Project Root)
    # This places 'app' folder inside 'bantu-kua', resulting in /home/u1525344/bantu-kua/app
    - /bin/cp -R app $DEPLOYPATH
    - /bin/cp composer.json $DEPLOYPATH
    - /bin/cp spark $DEPLOYPATH
    
    # 3. Copy Public Assets
    - /bin/cp -R public/assets $PUBLICPATH
    - /bin/cp public/index.php $PUBLICPATH
    - /bin/cp public/.htaccess $PUBLICPATH
    - /bin/cp public/favicon.ico $PUBLICPATH
    - /bin/cp public/robots.txt $PUBLICPATH

    # 4. Adjust Paths in index.php (Server Side Only)
    # Changes '../app/Config/Paths.php' to Absolute Path on Server
    - sed -i "s|../app/Config/Paths.php|/home/u1525344/bantu-kua/app/Config/Paths.php|g" $PUBLICPATH/index.php

    # 5. Install Dependencies (Optional)
    # - cd $DEPLOYPATH && /usr/bin/composer install --no-dev
